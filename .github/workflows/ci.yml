name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - name: Test release version handling
        run: python3 tests/release-metadata.test.py
      - name: Resolve build version
        id: version
        run: python3 scripts/release-metadata.py >> "$GITHUB_OUTPUT"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=low
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test frontend
        run: npm test

  web-client:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build frontend bundle
        run: npm run build:client
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-client
          path: dist/client
          if-no-files-found: error
          retention-days: 1

  backend:
    needs: web-client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: web-client
          path: dist/client
      - name: Test Rust backend
        run: npm run test:rust
      - name: Test remote ACP transports
        run: npm run test:remote
      - name: Test Rust-hosted REST/SSE bridge
        run: node --import tsx scripts/ui-smoke.ts
      - name: Test HTTP trust boundaries and process cleanup
        run: node --import tsx scripts/server-boundary-smoke.ts
      - name: Test ACP protocol integration
        run: node --import tsx scripts/acp-protocol-smoke.ts

  coverage:
    needs: web-client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - run: npm ci
      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: web-client
          path: dist/client
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Install browser for instrumented integration coverage
        run: npx playwright install --with-deps chromium
      - name: Enforce Rust coverage
        run: npm run test:coverage
        env:
          ATTYD_MIN_RUST_COVERAGE: "85"

  browser:
    needs: web-client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: web-client
          path: dist/client
      - run: npx playwright install --with-deps chromium
      - name: Build browser-test host
        run: cargo build --locked
        env:
          ATTYD_SKIP_WEB_BUILD: "1"
      - name: Test browser UI
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  binaries:
    name: binary (${{ matrix.artifact }})
    needs: [web-client, metadata]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: attyd-linux-x86_64-gnu
            runner: ubuntu-24.04
            musl: false
          - target: aarch64-unknown-linux-gnu
            artifact: attyd-linux-aarch64-gnu
            runner: ubuntu-24.04-arm
            musl: false
          - target: x86_64-unknown-linux-musl
            artifact: attyd-linux-x86_64-musl
            runner: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            artifact: attyd-linux-aarch64-musl
            runner: ubuntu-24.04-arm
            musl: true
    steps:
      - uses: actions/checkout@v6
      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: web-client
          path: dist/client
      - name: Install musl package index
        if: matrix.musl
        run: sudo apt-get update
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get install --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          ATTYD_SKIP_WEB_BUILD: "1"
          ATTYD_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
      - name: Verify release binary
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          actual="$(target/${{ matrix.target }}/release/attyd --version)"
          if [[ "$actual" != "attyd $EXPECTED_VERSION" ]]; then
            printf 'Version mismatch: expected "%s", got "%s"\n' "attyd $EXPECTED_VERSION" "$actual" >&2
            exit 1
          fi
          echo "$actual"
      - name: Set up Node.js for license materials and smoke tests
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Collect third-party license materials
        run: npm run licenses -- ${{ matrix.target }}
      - name: Test standalone release binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: npm run test:binary
        env:
          ATTYD_RUST_BINARY: target/${{ matrix.target }}/release/attyd
      - name: Generate checksum
        working-directory: target/${{ matrix.target }}/release
        run: sha256sum attyd > attyd.sha256
      - name: Create artifact directory
        run: mkdir -p artifacts
      - name: Package release binary
        run: >-
          tar -C target/${{ matrix.target }}/release -czf
          "$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact }}.tar.gz"
          attyd attyd.sha256 THIRD_PARTY_LICENSES.txt
          -C "$GITHUB_WORKSPACE" LICENSE
      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, audit, frontend, backend, browser, coverage, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: attyd-linux-*
          path: artifacts
          merge-multiple: true
      - name: Check all release targets and generate archive checksums
        working-directory: artifacts
        run: |
          for target in x86_64-gnu aarch64-gnu x86_64-musl aarch64-musl; do
            test -s "attyd-linux-$target.tar.gz"
          done
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          options=()
          if [[ "$PRERELEASE" == "true" ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/*.tar.gz artifacts/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${options[@]}"
